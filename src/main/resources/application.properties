spring.application.name=gerenciador-pedidos-alura
# Allows the application to read ".env" files
spring.config.import=optional:file:.env[.properties]

# Oracle Free rodando no Docker (ver docker-compose.yml).
# FREEPDB1 e o nome do banco (pluggable database) que vem na imagem.
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=${ORACLE_USERNAME}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# As tabelas sao criadas pelos scripts em database/oracle (padrao em empresas com Oracle).
# O Hibernate nao cria nem altera nada. O dialeto do Oracle e detectado sozinho.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Mostra o SQL gerado pelo Hibernate no console (bom para estudar).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
